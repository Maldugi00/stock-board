name: 모의계좌

# 모의투자 계좌 잔고 조회 시험. 직접 실행할 때만 돈다(주문 없음). 자동 주문은 '데이터 수집' 안에서 돈다.
on:
  workflow_dispatch:

concurrency:
  group: trade
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 저장해 둔 토큰 불러오기
        run: |
          mkdir -p data
          if git fetch --depth 1 origin data 2>/dev/null; then
            git archive FETCH_HEAD state | tar -x -C data || true
          fi
      - name: 모의계좌 점검 (잔고·주문 형식·체결 조회)
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_ACCOUNT_NO: ${{ secrets.KIS_ACCOUNT_NO }}
          KIS_ACCOUNT_PRD: ${{ secrets.KIS_ACCOUNT_PRD }}
          DATA_DIR: data
        run: python3 scripts/trade.py probe balance
