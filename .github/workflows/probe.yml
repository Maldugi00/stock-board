name: 임시 점검
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 저장해 둔 토큰 불러오기
        run: |
          mkdir -p data
          if git fetch --depth 1 origin data 2>/dev/null; then git archive FETCH_HEAD state | tar -x -C data || true; fi
      - name: 점검
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          DATA_DIR: data
        run: python3 scripts/probe_flow.py
