name: 데이터 수집

on:
  workflow_dispatch:
  push:
    branches: [collector]
    paths: ["scripts/collect.py", "config/**", ".github/workflows/collect.yml"]
  schedule:                      # 기본 가지(main)에 있을 때만 동작한다. 시각은 UTC.
    - cron: "*/10 0-6 * * 1-5"   # 평일 09:00~15:50 KST, 10분마다
    - cron: "40 23 * * 0-4"      # 평일 08:40 KST, 장 시작 전 한 번
    - cron: "10 7 * * 1-5"       # 평일 16:10 KST, 장 마감 뒤 한 번

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 지난 데이터 불러오기
        run: |
          mkdir -p data
          if git fetch --depth 1 origin data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C data
          fi
      - name: 수집
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DATA_DIR: data
        run: python3 scripts/collect.py
      - name: 데이터 가지에 저장 (기록을 쌓지 않고 최신 한 벌만 둔다)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
